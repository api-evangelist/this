aid: this
name: THIS
description: THIS™ is a UK plant-based food company making high-protein vegan meat alternatives
  — including meat-free chicken, bacon, sausages, burgers and mince — sold through major British
  supermarkets such as Tesco, Sainsbury's, Waitrose, Ocado, Morrisons, Asda and Co-op. Founded
  in 2019 and backed by Seedcamp, THIS™ is a consumer packaged goods (CPG) brand focused on
  absurdly tasty plant-based food rather than a developer platform. It operates a marketing and
  recipe website but publishes no public API, developer documentation, or SDK at the time of
  this enrichment pass.
